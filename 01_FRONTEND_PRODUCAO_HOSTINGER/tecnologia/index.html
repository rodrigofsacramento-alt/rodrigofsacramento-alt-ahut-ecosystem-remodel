            const newTimeline = t.timeline ? [...t.timeline] : [];

              status: `Movido para ${newMain.replace('_', ' ')}${subLabel}`,
              date: new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
              user: 'Squad Ahut Tech'
            });

              ...t,
              main_status: newMain,
              subcategory: (newMain === 'a_analisar' || newMain === 'a_executar') ? 'nao_especificado' : newSub,
              timeline: newTimeline
            };
          }
          return t;
        });
        saveTickets(updated);
        if (selectedTicket && selectedTicket.id === id) {
          setSelectedTicket(updated.find(t => t.id === id));
        }
      };

        if (confirm('Deseja realmente excluir este chamado?')) {
          const updated = tickets.filter(t => t.id !== id);
          saveTickets(updated);
          if (selectedTicket?.id === id) setSelectedTicket(null);
        }

        setIsAiModalOpen(false);
        setIsManualModalOpen(false);
      };

          t.description.toLowerCase().includes(searchTerm.toLowerCase()) ||
          t.code.toLowerCase().includes(searchTerm.toLowerCase()) ||
          t.requesterName.toLowerCase().includes(searchTerm.toLowerCase()) ||
          t.module.toLowerCase().includes(searchTerm.toLowerCase());

        const matchesModule = moduleFilter === 'todos' || t.module === moduleFilter;
        return matchesSearch && matchesPriority && matchesModule;

    // -------------------------------------------------------------------
    // MODAL DO AGENTE IA DE TRIAGEM
    // -------------------------------------------------------------------
    function AiIntakeModal({ onClose, onConfirm }) {
      const [messages, setMessages] = useState([
        {
          id: 1,
          sender: 'ai',
          text: 'Olá! Sou o Agente de Triagem de Tecnologia da ApeXfy / Ahut. Estou aqui para entender a melhoria ou ajuste que você precisa no sistema de forma simples, direta e sem termos técnicos difíceis. 😊\n\nEm qual módulo do sistema você estava e o que você gostaria de mudar ou criar?',
          suggestions: [
            'Central de Atendimento / WhatsApp',
            'Gestão de Leads & Filtros',
            'Agenda & Visitas',
            'Imóveis & Propostas',
            'Nova Ferramenta'
          ]
        }
      ]);
      const [inputVal, setInputVal] = useState('');
      const [understandingScore, setUnderstandingScore] = useState(25);
      const [isThinking, setIsThinking] = useState(false);
      const [isRecording, setIsRecording] = useState(false);
      const [recordSecs, setRecordSecs] = useState(0);
      const [attachments, setAttachments] = useState([]);
      const [extracted, setExtracted] = useState({
        title: '',
        description: '',
        module: 'Frontend & UI',
        business_impact: '',
        priority: 'media',
        acceptance_criteria: []
      });

      const chatEndRef = useRef(null);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        if (window.lucide) lucide.createIcons();
      }, [messages, isThinking]);

      useEffect(() => {
        let timer;
        if (isRecording) {
          timer = setInterval(() => setRecordSecs(s => s + 1), 1000);
        } else {
          setRecordSecs(0);
        }
        return () => clearInterval(timer);
      }, [isRecording]);

      const handleSend = (overrideText) => {
        const text = (overrideText || inputVal).trim();
        if (!text && attachments.length === 0) return;

        const userMsg = {
          id: Date.now(),
          sender: 'user',
          text: text || 'Anexei os arquivos para ilustrar a melhoria.',
          attachments: attachments.length > 0 ? [...attachments] : undefined
        };

        setMessages(prev => [...prev, userMsg]);
        setInputVal('');
        setAttachments([]);
        setIsThinking(true);

        setTimeout(() => {
          const count = messages.filter(m => m.sender === 'user').length + 1;
          let reply = '';
          let score = understandingScore;
          let suggestions = [];

          if (count === 1) {
            score = 60;
            reply = 'Compreendi perfeitamente o cenário! Me conta: quando você tentou fazer isso hoje, o que aconteceu de errado ou o que falta para ficar perfeito na sua rotina?';
            suggestions = ['Demora muito tempo manualmente', 'Gera confusão nos atendimentos', 'Falta um botão direto de ação'];
          } else if (count === 2) {
            score = 85;
            reply = 'Excelente detalhe! Ficou muito claro. Se tiver algum print da tela ou quiser gravar um áudio de voz rápido explicando, pode anexar agora. Além disso: quem são os principais usuários impactados?';
            suggestions = ['Toda a equipe de corretores', 'Apenas os gestores', 'Todos os colaboradores'];
          } else {
            score = 100;
            reply = 'Perfeito! Consegui montar o diagnóstico completo do chamado com os critérios de aceite e impacto técnico. Confira o resumo ao lado direito e confirme para enviarmos direto para a fila "A Analisar" do Squad de Tecnologia!';
            setExtracted({
              title: text.length > 40 ? text.slice(0, 45) + '...' : `Melhoria: ${text}`,
              description: `Solicitação estruturada via Agente IA: ${text}. Validado com foco em eficiência operacional e eliminação de atritos.`,
              module: text.toLowerCase().includes('chat') || text.toLowerCase().includes('whatsapp') ? 'Central de Atendimento / WhatsApp' : text.toLowerCase().includes('lead') ? 'Leads & CRM' : 'Frontend & Operações',
              business_impact: 'Otimiza o fluxo de trabalho da equipe, reduz cliques repetitivos e previne erros operacionais.',
              priority: text.toLowerCase().includes('urgente') || text.toLowerCase().includes('travou') ? 'alta' : 'media',
              acceptance_criteria: [
                'Interface intuitiva e sem etapas desnecessárias',
                'Confirmação visual da ação realizada',
                'Compatibilidade mantida com o banco e broker'
              ]
            });
          }

          setUnderstandingScore(score);
          setIsThinking(false);
          setMessages(prev => [
            ...prev,
            { id: Date.now() + 1, sender: 'ai', text: reply, suggestions: suggestions.length > 0 ? suggestions : undefined }
          ]);
        }, 1100);
      };

      const handleConfirmSubmit = () => {
        const ticketNum = Math.floor(100 + Math.random() * 900);
        const newTicket = {
          id: `tck-${Date.now()}`,
          code: `TCK-2026-${ticketNum}`,
          title: extracted.title || 'Melhoria de Sistema Triada por IA',
          description: extracted.description || 'Chamado aberto via Agente Conversacional de Tecnologia.',
          problem_context: extracted.problem_context || 'Nenhum contexto de problema fornecido.',
          module: extracted.module,
          requesterName: 'Rodrigo Sacramento',
          requesterRole: 'Gestão de Operações',
          requesterDepartment: 'Operações Ahut',
          priority: extracted.priority,
          main_status: 'a_analisar',
          subcategory: 'nao_especificado',
          delivery_forecast: new Date(Date.now() + 86400000 * 3).toISOString().split('T')[0],
          created_at: new Date().toISOString(),
          assigned_to: 'Squad Ahut Tech (CTO)',
          impact_level: extracted.priority === 'alta' ? 'Alto' : 'Médio',
          is_ai_triaged: true,
          business_impact: extracted.business_impact,
          acceptance_criteria: extracted.acceptance_criteria,
          chat_transcript: messages,
          attachments: attachments.length > 0 ? attachments : undefined,
          timeline: [
            { status: 'Chamado Triado via Agente IA', date: new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }), user: 'Agente de Triagem' },
            { status: 'Encaminhado para Fila "A Analisar"', date: new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }), user: 'Squad Ahut Tech' }
          ]
        };
        onConfirm(newTicket);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
          <div className="bg-[#0B111E] border border-orange-500/40 rounded-2xl w-full max-w-5xl h-[88vh] flex flex-col shadow-2xl overflow-hidden">
            
            {/* Header */}
            <div className="p-4 bg-[#1E293B] border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="p-2.5 bg-gradient-to-tr from-orange-500 to-amber-500 rounded-xl text-slate-950 shadow-[0_0_20px_rgba(249,115,22,0.4)] flex items-center justify-center">
                  <i data-lucide="bot" className="w-6 h-6 text-slate-950"></i>
                </div>
                <div>
                  <h3 className="font-bold text-sm text-white">Agente de Triagem de Tecnologia</h3>
                  <p className="text-[11px] text-slate-400">Conte o que você precisa em palavras simples. A IA cuidará da especificação técnica.</p>
                </div>
              </div>

              <div className="flex items-center gap-3 bg-slate-900 px-4 py-2 rounded-xl border border-slate-800">
                <div className="text-right">
                  <div className="text-[10px] text-slate-400">Diagnóstico do Chamado</div>
                  <div className="text-xs font-bold text-orange-400 font-mono">{understandingScore}% Compreendido</div>
                </div>
                <div className="w-24 bg-slate-800 h-2.5 rounded-full overflow-hidden">
                  <div className="bg-gradient-to-r from-orange-500 to-emerald-400 h-full transition-all duration-500" style={{ width: `${understandingScore}%` }}></div>
                </div>
              </div>

              <button onClick={onClose} className="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            {/* Split */}
            <div className="flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-hidden">
              
              {/* Chat Area */}
              <div className="lg:col-span-7 flex flex-col h-full border-r border-slate-800 bg-[#070B14]/70">
                <div className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
                  {messages.map((msg, i) => (
                    <div key={i} className={`flex gap-3 ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                      {msg.sender === 'ai' && (
                        <div className="h-7 w-7 rounded-lg bg-orange-500/20 text-orange-400 flex items-center justify-center shrink-0 border border-orange-500/30">
                          <i data-lucide="bot" className="w-4 h-4"></i>
                        </div>
                      )}
                      <div className="max-w-[85%] space-y-2">
                        <div className={`p-3.5 rounded-2xl text-xs leading-relaxed ${
                          msg.sender === 'user'
                            ? 'bg-orange-500 text-white rounded-tr-none'
                            : 'bg-slate-900 text-slate-200 border border-slate-800 rounded-tl-none'
                        }`}>
                          <p className="whitespace-pre-line">{msg.text}</p>
                        </div>
                        {msg.suggestions && (
                          <div className="flex flex-wrap gap-1.5 pt-1">
                            {msg.suggestions.map((sug, sIdx) => (
                              <button
                                key={sIdx}
                                onClick={() => handleSend(sug)}
                                className="text-[11px] bg-orange-500/10 hover:bg-orange-500/20 text-orange-300 border border-orange-500/30 px-2.5 py-1 rounded-full transition-all text-left"
                              >
                                {sug}
                              </button>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                  {isThinking && (
                    <div className="flex items-center gap-2 text-xs text-orange-400 p-2 bg-orange-500/10 rounded-xl w-fit border border-orange-500/20 animate-pulse">
                      <i data-lucide="sparkles" className="w-4 h-4"></i> O Agente está analisando sua solicitação...
                    </div>
                  )}
                  <div ref={chatEndRef}></div>
                </div>

                {/* Input Bar */}
                <div className="p-3 bg-[#0B111E] border-t border-slate-800">
                  {isRecording ? (
                    <div className="flex items-center justify-between bg-red-500/10 border border-red-500/30 p-2.5 rounded-xl text-xs text-red-400 animate-pulse">
                      <span className="font-bold">Gravando áudio de voz... 0:{recordSecs < 10 ? '0' : ''}{recordSecs}</span>
                      <button onClick={() => { setIsRecording(false); setAttachments(p => [...p, { id: Date.now(), name: `audio_${recordSecs}s.mp3`, type: 'audio', duration: `0:${recordSecs}` }]); }} className="bg-red-500 text-white px-3 py-1 rounded-lg text-xs font-bold">
                        Finalizar Gravação
                      </button>
                    </div>
                  ) : (
                    <div className="flex items-center gap-2">
                      <button onClick={() => setIsRecording(true)} className="p-2.5 bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-amber-400 rounded-xl border border-slate-800">
                        <i data-lucide="mic" className="w-4 h-4"></i>
                      </button>
                      <input
                        type="text"
                        placeholder="Explique com suas palavras o que precisa..."
                        className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white outline-none focus:border-orange-500"
                        value={inputVal}
                        onChange={(e) => setInputVal(e.target.value)}
                        onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                      />
                      <button onClick={() => handleSend()} className="p-2.5 bg-orange-500 hover:bg-orange-400 text-slate-950 rounded-xl font-bold">
                        <i data-lucide="send" className="w-4 h-4"></i>
                      </button>
                    </div>
                  )}
                </div>
              </div>

              {/* Summary Area */}
              <div className="lg:col-span-5 flex flex-col h-full bg-[#0B111E] p-5 justify-between space-y-4 overflow-y-auto custom-scrollbar">
                <div className="space-y-4">
                  <div className="flex items-center gap-2 border-b border-slate-800 pb-3">
                    <i data-lucide="sparkles" className="w-4 h-4 text-orange-400"></i>
                    <h4 className="text-xs font-bold text-white uppercase tracking-wider">
                      Especificação Gerada pela IA
                    </h4>
                  </div>

                  {understandingScore < 80 ? (
                    <div className="h-64 flex flex-col items-center justify-center text-center p-6 border border-dashed border-slate-800 rounded-xl space-y-3">
                      <i data-lucide="bot" className="w-10 h-10 text-orange-400/50 animate-bounce"></i>
                      <p className="text-xs text-slate-400">O Agente está dialogando com o colaborador para estruturar o ticket.</p>
                    </div>
                  ) : (
                    <div className="space-y-3 text-xs">
                      <div>
                        <span className="text-[10px] font-bold uppercase text-slate-500">Título Estruturado</span>
                        <p className="font-semibold text-white mt-0.5 bg-slate-900 p-2.5 rounded-lg border border-slate-800">{extracted.title}</p>
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <span className="text-[10px] font-bold uppercase text-slate-500">Módulo</span>
                          <p className="font-medium text-orange-300 mt-0.5 bg-slate-900 p-2 rounded-lg border border-slate-800">{extracted.module}</p>
                        </div>
                        <div>
                          <span className="text-[10px] font-bold uppercase text-slate-500">Prioridade Sugerida</span>
                          <p className="font-bold text-amber-400 mt-0.5 bg-slate-900 p-2 rounded-lg border border-slate-800">🟡 Média</p>
                        </div>
                      </div>
                      <div>
                        <span className="text-[10px] font-bold uppercase text-slate-500">Impacto no Negócio</span>
                        <p className="text-slate-300 mt-0.5 bg-slate-900 p-2.5 rounded-lg border border-slate-800">{extracted.business_impact}</p>
                      </div>
                    </div>
                  )}
                </div>

                <div className="pt-4 border-t border-slate-800 space-y-2">
                  <button
                    disabled={understandingScore < 80}
                    onClick={handleConfirmSubmit}
                    className={`w-full py-3 rounded-xl font-bold text-xs uppercase tracking-wider flex items-center justify-center gap-2 transition-all ${
                      understandingScore >= 80
                        ? 'bg-gradient-to-r from-emerald-500 to-orange-500 text-slate-950 cursor-pointer shadow-[0_0_20px_rgba(16,185,129,0.3)]'
                        : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                    }`}
                  >
                    <i data-lucide="check-circle-2" className="w-4 h-4"></i> Confirmar e Submeter para "A Analisar"
                  </button>
                </div>
              </div>

            </div>

          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------
    // MODAL DE DETALHES DO TICKET
    // -------------------------------------------------------------------
    function TicketDetailModal({ ticket, onClose, onMove, onDelete }) {
      const [activeTab, setActiveTab] = useState('overview');

      useEffect(() => {
        if (window.lucide) lucide.createIcons();
      }, [activeTab]);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
          <div className="bg-[#0B111E] border border-slate-800 rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            
            {/* Header */}
            <div className="p-5 bg-[#1E293B] border-b border-slate-800 flex items-center justify-between">
              <div className="space-y-1">
                <div className="flex items-center gap-2">
                  <span className="font-mono font-bold text-xs bg-orange-500/10 text-orange-400 px-2.5 py-0.5 rounded border border-orange-500/20">
                    {ticket.code}
                  </span>
                  {ticket.is_ai_triaged && (
                    <span className="text-[10px] bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded border border-purple-500/30 flex items-center gap-1">
                      <i data-lucide="bot" className="w-3 h-3"></i> Triado por IA
                    </span>
                  )}
                </div>
                <h2 className="text-base font-bold text-white">{ticket.title}</h2>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            {/* Abas */}
            <div className="flex items-center gap-1 px-5 border-b border-slate-800 bg-[#070B14]">
              {[
                { id: 'overview', label: 'Visão Geral & Requisitos', icon: 'sliders-horizontal' },
                { id: 'attachments', label: `Anexos (${ticket.attachments?.length || 0})`, icon: 'paperclip' },
                { id: 'timeline', label: 'Histórico & Auditoria', icon: 'activity' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-4 py-3 text-xs font-bold border-b-2 transition-all flex items-center gap-2 ${
                    activeTab === tab.id
                      ? 'border-orange-500 text-orange-400'
                      : 'border-transparent text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <i data-lucide={tab.icon} className="w-3.5 h-3.5"></i> {tab.label}
                </button>
              ))}
            </div>

            {/* Body */}
            <div className="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar text-xs">
              {activeTab === 'overview' && (
                <div className="space-y-6">
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 p-4 rounded-xl bg-slate-900/60 border border-slate-800">
                    <div>
                      <span className="text-[10px] uppercase text-slate-500 font-bold">Módulo</span>
                      <p className="font-semibold text-white mt-0.5">{ticket.module}</p>
                    </div>
                    <div>
                      <span className="text-[10px] uppercase text-slate-500 font-bold">Solicitante</span>
                      <p className="font-semibold text-white mt-0.5">{ticket.requesterName}</p>
                    </div>
                    <div>
                      <span className="text-[10px] uppercase text-slate-500 font-bold">Responsável</span>
                      <p className="font-semibold text-orange-400 mt-0.5">{ticket.assigned_to}</p>
                    </div>
                    <div>
                      <span className="text-[10px] uppercase text-slate-500 font-bold">Previsão</span>
                      <p className="font-semibold text-emerald-400 font-mono mt-0.5">{ticket.delivery_forecast}</p>
                    </div>
                  </div>

                  <div>
                    <h4 className="font-bold text-slate-300 uppercase tracking-wider text-[11px] mb-1.5">Descrição do Chamado</h4>
                    <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 text-slate-300 leading-relaxed">
                      {ticket.description}
                    </div>
                  </div>

                  {ticket.problem_context && (
                    <div>
                      <h4 className="font-bold text-red-400 uppercase tracking-wider text-[11px] mb-1.5 flex items-center gap-1.5">
                        <i data-lucide="alert-triangle" className="w-3.5 h-3.5"></i> Contexto do Problema (Dor)
                      </h4>
                      <div className="bg-red-500/5 p-4 rounded-xl border border-red-500/20 text-red-200 leading-relaxed">
                        {ticket.problem_context}
                      </div>
                    </div>
                  )}

                  {ticket.business_impact && (
                    <div>
                      <h4 className="font-bold text-slate-300 uppercase tracking-wider text-[11px] mb-1.5">Impacto no Negócio</h4>
                      <div className="bg-orange-500/5 p-4 rounded-xl border border-orange-500/20 text-orange-200 leading-relaxed">
                        {ticket.business_impact}
                      </div>
                    </div>
                  )}

                  {ticket.acceptance_criteria && (
                    <div>
                      <h4 className="font-bold text-slate-300 uppercase tracking-wider text-[11px] mb-1.5">Critérios de Aceite</h4>
                      <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 space-y-2">
                        {ticket.acceptance_criteria.map((crit, idx) => (
                          <div key={idx} className="flex items-center gap-2 text-slate-300">
                            <i data-lucide="check-circle-2" className="w-4 h-4 text-emerald-400 shrink-0"></i>
                            <span>{crit}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                  {ticket.subtickets && (
                    <div className="mt-4">
                      <h4 className="font-bold text-sky-400 uppercase tracking-wider text-[11px] mb-1.5 flex items-center gap-1.5">
                        <i data-lucide="git-merge" className="w-4 h-4"></i> Pré-requisitos & Subtickets
                      </h4>
                      <div className="bg-slate-900/80 p-4 rounded-xl border border-sky-500/20 space-y-3">
                        {ticket.subtickets.map((sub, idx) => (
                          <div key={idx} className="flex items-center justify-between text-slate-300 border-b border-slate-800/60 pb-2 last:border-0 last:pb-0">
                            <div className="flex items-center gap-2">
                              <i data-lucide={sub.stage === 'executado' ? "check-circle-2" : "circle"} className={`w-4 h-4 ${sub.stage === 'executado' ? 'text-emerald-400' : 'text-slate-500'} shrink-0`}></i>
                              <span className={sub.stage === 'executado' ? 'line-through text-slate-500' : ''}>{sub.title}</span>
                            </div>
                            <div className="flex items-center">
                              <span className={`text-[9px] font-bold uppercase px-2 py-0.5 rounded border 
                                ${sub.stage === 'a_analisar' ? 'bg-orange-500/10 text-orange-400 border-orange-500/30' : ''}
                                ${sub.stage === 'a_executar' ? 'bg-slate-800 text-slate-400 border-slate-700' : ''}
                                ${sub.stage === 'executando' ? 'bg-amber-500/10 text-amber-400 border-amber-500/30' : ''}
                                ${sub.stage === 'em_validacao' ? 'bg-purple-500/10 text-purple-400 border-purple-500/30' : ''}
                                ${sub.stage === 'executado' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' : ''}
                              `}>
                                {sub.stage.replace('_', ' ')}
                              </span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                </div>
              )}

              {activeTab === 'attachments' && (
                <div className="space-y-4">
                  {(!ticket.attachments || ticket.attachments.length === 0) ? (
                    <div className="h-40 flex items-center justify-center text-slate-500 border border-dashed border-slate-800 rounded-xl">
                      Nenhum anexo vinculado a este chamado
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {ticket.attachments.map(att => (
                        <div key={att.id} className="p-3.5 bg-slate-900 border border-slate-800 rounded-xl flex items-center justify-between">
                          <div className="flex items-center gap-3">
                            <div className="p-2 bg-orange-500/10 rounded-lg text-orange-400">
                              <i data-lucide={att.type === 'audio' ? 'mic' : 'file-text'} className="w-5 h-5"></i>
                            </div>
                            <div>
                              <h5 className="font-semibold text-slate-200">{att.name}</h5>
                              <span className="text-[10px] text-slate-500">{att.size || att.duration}</span>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {activeTab === 'timeline' && (
                <div className="space-y-3">
                  {ticket.timeline?.map((item, idx) => (
                    <div key={idx} className="bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between">
                      <div>
                        <span className="font-bold text-white block">{item.status}</span>
                        <span className="text-[10px] text-slate-400">Por: {item.user}</span>
                      </div>
                      <span className="text-[10px] text-slate-500 font-mono">{item.date}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Footer */}
            <div className="p-4 bg-[#1E293B] border-t border-slate-800 flex items-center justify-between text-xs">
              <button
                onClick={() => onDelete(ticket.id)}
                className="px-3 py-2 bg-red-500/10 text-red-400 rounded-xl font-bold uppercase tracking-wider flex items-center gap-1.5 border border-red-500/20 hover:bg-red-500/20"
              >
                <i data-lucide="trash-2" className="w-3.5 h-3.5"></i> Excluir Chamado
              </button>
              <button onClick={onClose} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-bold uppercase tracking-wider">
                Fechar
              </button>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
    setTimeout(() => {
      if (window.lucide) lucide.createIcons();
    }, 100);
  </script>
</body>
</html>
